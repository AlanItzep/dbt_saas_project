# DBT Project Configuration for SaaS Analytics Warehouse
# This project demonstrates data transformation best practices:
# - Layered modeling (staging, intermediate, marts)
# - Data testing and validation
# - Comprehensive documentation
# - Business logic implementation

name: 'saas_analytics'
version: '1.0.0'
config-version: 2

# These are the correct DBT 2.0 keys (no hyphens before "paths")
model-paths: ['models']
analysis-paths: ['analysis']
test-paths: ['tests']
macro-paths: ['macros']
snapshot-paths: ['snapshots']

target-path: 'target'
clean-targets:
  - 'target'
  - 'dbt_packages'

profile: 'saas_analytics'

models:
  saas_analytics:
    staging:
      +materialized: view
      +schema: staging

    marts:
      +materialized: table
      +schema: marts